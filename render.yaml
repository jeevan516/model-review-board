# Render Blueprint: one Python web service and one PostgreSQL database.
# Render builds this with its native Python runtime; there is no Dockerfile.
services:
  - type: web
    name: model-review-board
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # create_all() only adds missing tables, so running init-db on every start is safe.
    startCommand: flask --app app init-db && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Render injects the managed connection string; nothing is copied into the repo.
      - key: DATABASE_URL
        fromDatabase:
          name: model-review-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: model-review-db
    plan: free
    region: frankfurt
    databaseName: model_reviews
    user: model_reviews
    # Only Render services in this account may connect; no public access.
    ipAllowList: []
